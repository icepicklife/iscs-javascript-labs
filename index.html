<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Search Products</title>
    <style>
        :root {
            --line: #d8d8d8;
            --muted: #5a5a5a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, Arial, sans-serif;
            max-width: 860px;
            margin: 0 auto;
            padding: 24px 16px 64px;
            color: #1a1a1a;
            line-height: 1.5;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 16px;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        #searchInput {
            flex: 1;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        button {
            padding: 8px 14px;
            font-size: 0.95rem;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #090c09;
            color: #d8d8d8;
        }

        button:disabled {
            color: #9a9a9a;
            cursor: not-allowed;
        }

        #status {
            margin: 12px 0;
            color: var(--muted);
            align-items: center;
        }

        #status:empty {
            display: none;
        }

        .product {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .product h2 {
            font-size: 1.3rem;
            margin: 0 0 8px;
        }

        .field {
            margin: 4px 0;
        }

        .field .label {
            color: var(--muted);
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .panel:not(:empty) {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--line);
        }

        .panel-heading {
            font-weight: 600;
            margin: 0 0 4px;
        }

        .line {
            margin: 2px 0;
        }

        .related-group {
            margin-top: 28px;
        }

        .related-group h2 {
            font-size: 1.2rem;
            margin: 0 0 12px;
        }

        .related-block {
            margin-bottom: 16px;
        }

        .related-block h3 {
            font-size: 1rem;
            margin: 0 0 4px;
        }
    </style>
</head>

<body>
    <h1>Search a Product</h1>

    <div class="search-bar">
        <input id="searchInput" type="text" placeholder="Enter a product keyword" />
        <button id="searchButton" type="button">Search</button>
    </div>

    <p id="status"></p>
    <div id="results"></div>
    <div id="related"></div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
